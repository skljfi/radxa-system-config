# Preserve existing profiles and generic initialization; only enable OUT1.
CARDINFO{driver}!="rockchip-es8388", GOTO="rock4d_out1_end"
ENV{rock4d_saved_device}="$config{sysfs_device}"
ENV{rock4d_saved_result}="$result"
CONFIG{sysfs_device}="/firmware/devicetree/base"
ATTR{model}=="ROCK 4D", CTL{reset}="mixer", CTL{name}="OUT1 Switch", CTL{do_search}=="1", CTL{values}="on"
ATTR{model}=="Radxa ROCK 4D*", CTL{reset}="mixer", CTL{name}="OUT1 Switch", CTL{do_search}=="1", CTL{values}="on"
CONFIG{sysfs_device}="$env{rock4d_saved_device}"
RESULT="$env{rock4d_saved_result}"
LABEL="rock4d_out1_end"
